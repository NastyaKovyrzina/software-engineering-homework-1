name: Part 2 Tests

on:
  push:
    paths:
      - 'Part_2/**'  

jobs:
  test:
    runs-on: ubuntu-latest 

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'  

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install -r Part_2/requirements.txt  # Берем зависимости именно из Part_2

    - name: Run tests
      run: |
        pytest Part_2/ -v